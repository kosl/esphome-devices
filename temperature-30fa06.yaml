esphome:
  name: temperature-30fa06
  friendly_name: Temperature 30fa06
  #platformio_options:
  #  platform_packages:
  #      - platformio/framework-libretiny@https://github.com/libretiny-eu/libretiny.git#feature/i2c-spi

bk72xx:
  board: cbu
  framework:
    version: "0.0.0"
    source: "https://github.com/libretiny-eu/libretiny#feature/i2c-spi"

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: "WowQuMIZZWhj+5Pdd9N4ZXzRXSEBFVdWyiGg6PWo5T0="

ota:
  - platform: esphome
    password: "02c7b83830b40305aa549b112ff7c50a"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Temperature-30Fa06"
    password: "nr7uQP8mqK5v"

captive_portal:
    
# --------------------
# STATUS LED (Network / API)
# --------------------
status_led:
  pin:
    number: P26
    inverted: false   # active HIGH

# --------------------
# I2C BUS
# --------------------
i2c:
  sda: P9
  scl: P6
  scan: true

# --------------------
# SENSORS
# --------------------
sensor:
  - platform: sht3xd
    address: 0x44
    temperature:
      name: "Temperature"
      accuracy_decimals: 1
      id: temp_sensor
    humidity:
      name: "Humidity"
      accuracy_decimals: 0
      id: hum_sensor
    update_interval: 60s

  - platform: adc
    pin: ADC3
    id: battery_voltage
    name: "Battery Voltage"
    update_interval: 60s
    attenuation: auto

# --------------------
# BUTTON
# --------------------
binary_sensor:
  - platform: gpio
    pin:
      number: P17
      mode: INPUT
      inverted: false
    name: "Device Button"
    on_press:
      - component.update: temp_sensor
      - component.update: hum_sensor
    on_multi_click:
      # Long press → reboot
      - timing:
          - ON for at least 3s
        then:
          - button.press: restart_button

# --------------------
# RESTART BUTTON (internal)
# --------------------
button:
  - platform: restart
    id: restart_button
    name: "Restart Device"