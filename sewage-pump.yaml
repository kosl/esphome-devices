# version: 1.6.0
# See https://www.espboards.dev/esp32/esp32-c3-super-mini-plus/
# Tank dimensions
# Large tank: south: 2.039 m, north: 1.956 m
# east: 2.747 m, west: 3.058 m, height: 1.477
# diagonal: se-nw 3.615 m, ne-sw 3.323
# corners rounded at radius 5 cm
# small south: 1.073 m, north 0.878 m, west 3.037 m, east 3.034
esphome:
  name: sewage-pump
  friendly_name: Sewage pump
  area: Vrt
  on_boot:
    priority: 600  # Medium-high priority (after WiFi connects)
    then:
      - light.turn_on:
          id: onboard_rgb_led
          red: 50%
          green: 0%
          blue: 50%
          brightness: 100%  # Optional, for full brightnes
  #    - globals.set: 
   #       id: total_pumped_volume
    #      value: '2.0'	

          
esp32:
  board: esp32-c3-devkitm-1
  variant: ESP32C3
  framework:
    type: esp-idf
  

# Enable logging
logger:
  level: DEBUG  # Options: DEBUG, INFO, WARN, ERROR, NONE
  logs:
    esp-idf: INFO   # To silent GPIO4 debug messages 
    sensor: INFO    # Disables [D][sensor:131] debug messages
    ct_clamp: INFO  # Disables [D][ct_clamp:041] debug messages
    jsn_sr04t: INFO    # Enable debug logging for JSN-SR04T sensor
    distance: DEBUG  # Custom log tag for distance sensor


# Enable Home Assistant API
api:
  encryption:
    key: "FVwlFObO8/F232+uYCjUk9+TFG7qXdtga7otAkRXo2M="

ota:
  - platform: esphome
    password: "6977e2c18f7f9057bddb18ff65c6fad4"

wifi:
  output_power: 10.5dB
  domain: .local.wgn.si
  networks:
  - ssid: !secret wifi_ssid
    password: !secret wifi_password
  - ssid: !secret wifi_mansarda_ssid
    password: !secret wifi_password
  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Sewage-Pump Fallback Hotspot"
    password: "a9xNtwK5zKgZ"

captive_portal:

web_server:
  port: 80

# Add two globals to hold the start reading and the accumulated total
globals:
  - id: pump_start_distance
    type: float
    restore_value: false
    initial_value: '0.85'
  - id: total_pumped_volume
    type: float
    restore_value: true
    initial_value: '0.0'  # in m³
  - id: pump_start_millis
    type: int  # Using int for millis()
    restore_value: false
    initial_value: '0'
  - id: last_pump_duration
    type: float
    restore_value: false
    initial_value: '0.0'
  - id: distance_samples
    type: int
    restore_value: false
    initial_value: '0'
  - id: water_tank_samples
    type: int
    restore_value: false
    initial_value: '0'



# OneWire bus for DS18B20 on GPIO5
one_wire:
  - platform: gpio
    pin:
      number: GPIO5
      mode:
        input: true
        pullup: true


# UART configurations for both ultrasonic sensors
uart:
  - id: uart_0  # First SJN-SR04T (GPIO21 TX, GPIO20 RX)
    tx_pin: GPIO21
    rx_pin: GPIO20
    baud_rate: 9600
    # https://mantech.co.za/Datasheets/Products/AJ-SR04M-200925A.pdf
  - id: uart_1  # Second AJ-SR04M (GPIO7 TX, GPIO6 RX)
    tx_pin: GPIO7
    rx_pin: GPIO6
    baud_rate: 9600



number: 
  # Intake pipe (bottom) at 60 cm, outtake at 53 cm, sensor funnel at 35 cm
  - platform: template
    name: "Pump Activation Level (High)"
    id: pump_high_level
    min_value: 60
    max_value: 130
    step: 1
    unit_of_measurement: "cm"
    optimistic: true
    restore_value: true
    initial_value: 85
    mode: BOX
    on_value:
      then:
        - logger.log:
            format: "Pump high level set to (cm): %.1f"
            args: id(pump_high_level).state
        - globals.set:
            id: pump_start_distance
            value: !lambda return id(pump_high_level).state/100;        
# Top of pump at 172 cm (handle starts at 167 cm)
  - platform: template
    name: "Pump Deactivation Level (Low)"
    id: pump_low_level
    min_value: 140
    max_value: 210 
    step: 1
    unit_of_measurement: "cm"
    optimistic: true
    restore_value: true
    initial_value: 170
    mode: BOX
    on_value:
      then:
        - logger.log: 
            format: "Pump low level set to (cm): %.1f"
            args: id(pump_low_level).state

        

sensor: 
  - platform: wifi_signal
    name: "WiFi Signal Strength"
    id: wifi_rssi
    update_interval: 5min  # Optional: Adjust how often it updates (default: 60s)
    unit_of_measurement: "dBm"
    accuracy_decimals: 0   # Optional: Reduce decimal places for cleaner readings
    device_class: signal_strength
    entity_category: diagnostic  # Optional: Hides from Home Assistant by default  
  - platform: dallas_temp
    name: "Temperature"
    update_interval: 5min
  - platform: template # Expose the running total
    name: "Total Pumped Volume"
    id: total_pumped_volume_sensor
    unit_of_measurement: "m³"
    accuracy_decimals: 3
    lambda: return id(total_pumped_volume);    
  - platform: jsn_sr04t # AJ-SR04M https://www.thingiverse.com/thing:6663550
    id: distance_sensor
    name: "Distance"
    update_interval: never # use dynamic update with interval below
    model: jsn_sr04t
    uart_id: uart_0
    filters:
      - clamp:
          min_value: 0.1
          max_value: 1.9
          ignore_out_of_range: true
      - timeout: 5min
      - calibrate_linear:
          # Format: sensor reading -> actual measured distance
          datapoints:  # JSN-SR04T module calibration:
            - 0.506 -> 0.841  # Point 1
            - 1.430 -> 1.690
            #- 1.445 -> 1.703  # Point 2
      # - min:
      #     window_size: 5  # Number of measurements
      #     send_every: 2 # How often to send
      #     send_first_at: 2
      # # Dynamic min/max window (5 samples):
      #  - When pump is OFF  -> use MIN of last 5 samples (idle smoothing)
      #  - When pump is ON   -> use MAX of last 5 samples (follow falling level)
      - lambda: |-
          static float buf[10];
          static int idx = 0;
          static int count = 0;

          // store current sample in ring buffer
          buf[idx] = x;
          idx = (idx + 1) % 10;
          if (count < 10) count++;

          if (count == 0) {
            // safety fallback: no history yet
            return x;
          }

          float extreme = buf[0];

          if (id(sewage_pump_relay).state) {
            // Pump ON -> use MAX of window
            for (int i = 1; i < count; i++) {
              if (buf[i] > extreme) extreme = buf[i];
            }
          } else {
            // Pump OFF -> use MIN of window
            for (int i = 1; i < count; i++) {
              if (buf[i] < extreme) extreme = buf[i];
            }
          }

          return extreme;

    on_value_range:
        - below: !lambda return id(pump_high_level).state/100.0;
          then:
            - lambda: |-
                id(pump_start_millis) = millis();
            - switch.turn_on: sewage_pump_relay
            - script.execute: pump_timeout_script  # <-- Start safety timer
            - light.turn_on:
                id: onboard_rgb_led
                red: 100%
                green: 0%
                blue: 0%
            - globals.set:
                id: pump_start_distance
                value: !lambda return id(distance_sensor).state;                 
        - above: !lambda return id(pump_low_level).state/100.0;
          then:
            - if:
                condition:
                  switch.is_on: sewage_pump_relay
                then: # Normally it takes 220 s to pump. If phases are reversed then 280 s.
                  - lambda: |-
                      id(last_pump_duration) = (millis() - id(pump_start_millis)) / 1000.0;
                      id(last_pump_duration_sensor).update();  
                  - switch.turn_off: sewage_pump_relay
                  - script.stop: pump_timeout_script  # <-- Cancel timer if turned off early
                  - light.turn_on:
                      id: onboard_rgb_led
                      red: 0%
                      green: 100%
                      blue: 0%
                  - globals.set:
                      id: total_pumped_volume
                      value: !lambda |-
                        float delta = id(distance_sensor).state - id(pump_start_distance); // Δdistance in m
                        float r = 0.995 / 2.0; // compute area from diameter
                        float area = M_PI * r * r;     // m²
                        return id(total_pumped_volume) + (delta * area); // volume in m³
                  - lambda: |-
                      id(total_pumped_volume_sensor).update();  
    on_value: 
      then:
        - logger.log:
            tag: distance
            level: INFO
            format: "Distance (m): %.3f, required %d samples"
            args:
              - id(distance_sensor).state
              - id(distance_samples)
        - sensor.template.publish:
            id: distance_samples_sensor
            state: !lambda 'return id(distance_samples);'
        - globals.set:
              id: distance_samples
              value: '0'      
    on_raw_value:
      then:
        - lambda: |-
            id(distance_samples)++;
        - logger.log:
            tag: distance
            format: "Raw Distance (m): %.3f, count: %d"
            args:
              - id(distance_sensor).raw_state
              - id(distance_samples)
  - platform: template
    name: "Distance Samples"
    id: distance_samples_sensor
    unit_of_measurement: "count"
    accuracy_decimals: 0
    entity_category: diagnostic
    update_interval: never
    lambda: |-
      return id(distance_samples);
  # Second  sensor 
  - platform: jsn_sr04t
    id: distance_sensor_2
    name: "Water Tank Level"
    update_interval: 6s
    model: jsn_sr04t # not aj_sr04m see https://community.home-assistant.io/t/waterproof-ultrasonic-distance-sensors-jsn-sr04t-aj-sr04m-or-sr04m-2/836561/8
    uart_id: uart_1
    filters:
      - timeout: 10min  
      - clamp:
          min_value: 0.1
          max_value: 1.8
          ignore_out_of_range: true
      - median:
          window_size: 11
          send_every: 5
          send_first_at: 5
      # Sensor shows 1.451 m when totaly empty and that is 1.777 m from the top
      # Max height is 0.333 m sensor reading. However, it lowered to 0.358 m due to some leackage
      # Pumping is possible up to 1.700 m from the top (equals 0% fill level)
      # Each cm of height is 85 liter of water
      # 1.451 -> 1.777
      # 1.242 -> 1.525
      # 0.358 -> 0.618
    on_value:
      then:
        - logger.log:
            tag: distance
            level: INFO
            format: "Water tank level (m): %.3f, required %d samples"
            args:
              - id(distance_sensor_2).state
              - id(water_tank_samples)
        - sensor.template.publish:
            id: water_tank_samples_sensor
            state: !lambda 'return id(water_tank_samples);'
        - globals.set:
            id: water_tank_samples
            value: '0'
    on_raw_value:
      then:
        - lambda: |-
            id(water_tank_samples)++;
        # - logger.log:
        #     tag: distance
        #     format: "Raw Water tank distance (m): %.3f, count: %d"
        #     args:
        #       - id(distance_sensor_2).raw_state
        #       - id(water_tank_samples)    
  - platform: template
    name: "Water Tank Samples"
    id: water_tank_samples_sensor
    unit_of_measurement: "count"
    accuracy_decimals: 0
    entity_category: diagnostic
    update_interval: never
    lambda: |-
      return id(water_tank_samples);

  - platform: template
    name: "Last Pumping Duration"
    id: last_pump_duration_sensor
    unit_of_measurement: "s"
    accuracy_decimals: 1
    lambda: return id(last_pump_duration);
    
  - platform: adc
    pin: GPIO4
    id: adc_sensor
    attenuation: 12dB  # auto or 12db?

  - platform: ct_clamp # ZMCT103C
    sensor: adc_sensor
    name: "CT Clamp Current (raw)"
    id: ct_current_raw
    internal: true
    sample_duration: 1000ms
    update_interval: 1000ms
    filters:
      - calibrate_linear:
          method: exact
          datapoints:
            - 0.014 -> 0.0087
            - 0.136 -> 0.733
            - 0.188 -> 1.74
            - 0.231 -> 9.6
      - clamp:
          min_value: 0.0  # Ensures no negative values
  # --- Published version: only publishes conditionally ---
  - platform: template
    id: ct_current_published
    name: "CT Clamp Current"
    unit_of_measurement: "A"
    accuracy_decimals: 2
    update_interval: never   # publish manually
    lambda: |-
      return id(ct_current_raw).state;
      
    
# Define the internal LED pin and configure it to blink   
#interval:
