switch:
  - platform: gpio
    name: "Sewage pump"
    pin:
      number: GPIO3
      inverted: true
    id: sewage_pump_relay
    restore_mode: ALWAYS_OFF
    interlock: &pump_interlock [sewage_pump_relay]
    interlock_wait_time: 300s

  - platform: gpio
    name: "Garden light"
    pin:
      number: GPIO1
      inverted: true
    id: garden_light_relay
    restore_mode: ALWAYS_OFF

light:
#  - platform: status_led
 #   name: "Status LED"
 #   id: esp_status_led
 #   icon: "mdi:alarm-light"
 #   pin:
 #     number: GPIO8
 #     inverted: false
 #   restore_mode: ALWAYS_OFF
  - platform: esp32_rmt_led_strip
    rgb_order: GRB
    chipset: ws2812
    pin: 
      number: GPIO8
      ignore_strapping_warning: true
    num_leds: 1
    name: "Onboard RGB LED"
    id: onboard_rgb_led
    entity_category: diagnostic

button:
  - platform: restart
    entity_category: diagnostic
    name: Restart

binary_sensor:
  - platform: status
    name: "Pump Status"
    id: pump_status
    entity_category: diagnostic

text_sensor:
  - platform: version
    name: "ESPHome Version"
    entity_category: diagnostic
  
script:
  - id: pump_timeout_script
    mode: restart
    then:
      - delay: 5min  # Adjust timeout duration here
      - logger.log: "Pump timeout reached — turning off pump"
      - switch.turn_off: sewage_pump_relay
      - light.turn_on:
          id: onboard_rgb_led
          red: 0%
          green: 0%
          blue: 100%
      - switch.turn_on: garden_light_relay

interval:
  - interval: 10s # When pump is OFF
    id: normal_interval
    then:
      - if:
          condition:
            not:
              switch.is_on: sewage_pump_relay
          then:
            - component.update: distance_sensor
  - interval: 0.5s # When pump is ON
    id: pump_interval
    then:
      - if:
          condition:
            switch.is_on: sewage_pump_relay
          then:
            - component.update: distance_sensor
  - interval: 1s
    id: ct_publish_control
    then:
      - lambda: |-
          static int counter = 0;
          static bool was_above = false;  // track previous state
          counter++;

          float current = id(ct_current_raw).state;
          bool is_above = current > 0.2;

          if (is_above) {
            // --- High current: publish every second ---
            id(ct_current_published).publish_state(current);
            counter = 0;
            was_above = true;
          } else {
            // --- Low current: publish once when crossing down, then every 60 s ---
            if (was_above) {
              // Just fell below 0.2 A → publish immediately once
              id(ct_current_published).publish_state(current);
              counter = 0;
              was_above = false;
            } else if (counter >= 60) {
              // Still below 0.2 A → publish every 60 s
              id(ct_current_published).publish_state(current);
              counter = 0;
            }
          }            
          
# Water tank dimensions (m)
# 3.028 x 0.868 m + 2.945  x 1.977 = 8.50 m2
# 3.082 m for the largest tank (2.945 m average)

# ZMCT103C Introduction: https://www.aliexpress.com/item/4000908383725.html#nav-description
# https://oshwlab.com/sulagaev/current_sensor_zmct103c_lm358
#   The module is equipped with the ZMCT103C series of small high-precision current transformers 
#   and high-precision op amp circuits for accurate sampling and proper compensation of signals. 
#   It is convenient for signal acquisition of AC power within 5A. 
#   The corresponding output analog AC signal can be adjusted. 
#   The required output voltage can be adjusted according to the potentiometer 
#   (adjusting the amplification ratio, the amplification range is 0-100 times), 
#   but the maximum voltage at the output (OUT) will not exceed 1/2 VCC.
# Parameter:
#  ZMCT103C parameters
#  Rated input current: 5A
#  Rated output current: 5mA
#  Change ratio: 1000:1
#  Phase difference: less than or equal to 20' (100Ω)
#  Linear range: 0-10A (100Ω)
#  Linearity: 0.2%
#  Precision level: 0.2
#  Isolation withstand voltage: 3000V
#  Working temperature: -40 ° C ~ 70 ° C
#  Sealing material: epoxy resin
#  Module supply voltage: 5-30V DC
# Instructions:
#  During measurement, the signal conductor to be tested passes through the transformer hole, 
#  VCC and GND are connected to the DC 5-30V power supply, VOUT and GND are connected to the oscilloscope, 
#  and the potentiometer is adjusted to get the waveform you want. 
#  The amplitude of the waveform will follow The measured current increases and increases, 
#  but the maximum does not exceed 1/2VCC.
#  The following figure shows the waveform measured when VCC is connected to a 5V power supply 
#  and one of the 60W soldering irons passes through the round hole of the transformer:
# Summary:
#   The ZMCT103C almost certainly uses an LM358 (or equivalent dual op-amp), 
#   which is not suitable for reliable 3.3V operation. 
#   Its design is optimized for 5V systems. For 3.3V projects, choose a different sensor 
#   explicitly rated for low-voltage use.
#
#
# At max amplification it shows 0.75 A raw value (1.74 A load)
# This should be achieved at 16 A load. 
# Meaning that for 1.74 A load should show 0.082 A raw value or less
# For max 6 A load (1.4 kW) should show 0.75A raw, meaning that for 1.75 A
# should be max 0.22 A raw value. 
# For better precission I have set up 0.2 A at 1.74 A load
# Could not go over 2.2A scaled measurement! 
# Therefore we aim for 3A max sat 0.75 A raw. Meaning 0.443 A raw at 1.74 A;
#
# I also bought this ZMCT103C module without thinking a lot. 
# It turned out that the dual LM385 amplifier is too sensitive for 5A range! 
# If you take a look into module schematics it can be observed that the sampling 
# resistor R1=100 ohm at 5 mA (5A load) already gives ±0.5V relative at the amplifier input.
# Amplifier itself gives gain of 100 (R5/R4), which means that for ±1 V fan out at U1.1 maximum
# input load is ±0.01 V/100Ω times 1:1000 = 0.1 A and not 5 A as declared. 
# Having in mind that the second amplifier also amplifies 10 times but the could be attenuated 
# 10 times by a variable resistor R12 the module is usable for AC currents below 0.05A. 
# Since the module output is isolated by C6 the input to ESP32 is floating and only by “undocumented” 
# negative input diodes the average level is then shifted to 1/2 of the output fan. 
# Furthermore, the module should be powered at 3.3 V and not at 5 V to prevent excess (unbiased) voltages.

# So, how to make the module usable at 0-10A range? Lowering sampling resistor (R1=50Ω) lowers 
# input to ±0.5V at op-amp input. Leaving R1=100Ω will give ±1.0V at 10A load 
# and this might be still acceptable if there is no amplification of the signal.

# Swapping existing onboard resistors to R4=100k, R9=10k, and R11=1k will change 
# gain to U1.1=1 and U1.2=1 respectively. R11 should be connected to plus (+) input of U1.1 (pin 3) 
# to get output bias of 1.4 V that could be then directly connected (by short-circuiting C6) 
# to ESP32 ADC input using attenuation of 12 dB ( max 2.45 V) giving voltage ranges from 0.4V to 2.45 V 
# for SAR conversion.


# Note on cable extension to 6 meters: 
# It only works for JSN-SR04T module, while fails with original AJ-SR04M
# Resolved by 5m cable extension of TTL RS232 signals



