# UART configurations for both ultrasonic sensors
uart:
  - id: uart_0  # First SJN-SR04T 
    tx_pin: GPIO3 # GPIO1 # GPIO3
    rx_pin: GPIO4 # GPIO2 # GPIO4
    baud_rate: 9600
    debug:
      direction: BOTH
    # https://mantech.co.za/Datasheets/Products/AJ-SR04M-200925A.pdf

sensor:
  - platform: jsn_sr04t # AJ-SR04M https://www.thingiverse.com/thing:6663550
    id: distance_sensor
    name: "Distance"
    update_interval: 1s
    model: jsn_sr04t
    uart_id: uart_0
    