esphome:
  name: rastlinjak-dvorisce
  friendly_name: Rastlinjak dvorisce

esp32:
  board: nologo_esp32c3_super_mini
  framework:
    type: esp-idf

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: "H7u5t2hDaCjr1YAOH/V+jRzTnIOKLUVvLxAX7E0phTc="

ota:
  - platform: esphome
    password: "8a832e8de693f5658c02a58ab117e1cf"

wifi:
  networks:
    - ssid: !secret wifi_ssid
      password: !secret wifi_password
    - ssid: !secret wifi_kuhinja_ssid
      password: !secret wifi_kuhinja_password
    - ssid: !secret wifi_mansarda_ssid
      password: !secret wifi_password
    - ssid: !secret wifi_garaza_ssid
      password: !secret wifi_password
    - ssid: !secret wifi_eteradxa_ssid
      password: !secret wifi_eteradxa_password
      hidden: true

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Rastlinjak-Dvorisce"
    password: "YCwfoC5Ny5kq"
  output_power: 8.5dB
  power_save_mode: none  # Better reliability over power saving

captive_portal:

switch:
  - platform: gpio
    id: motor_right_1
    pin: GPIO3
    name: "Motor Right Up"
    interlock: &motor_right_interlock [motor_right_1, motor_right_2]
  - platform: gpio
    id: motor_right_2
    pin: GPIO4
    name: "Motor Right Down"
    interlock: *motor_right_interlock
  - platform: gpio
    id: motor_left_1
    pin: GPIO5
    name: "Motor Left Up"
    interlock: &motor_left_interlock [motor_left_1, motor_left_2]
  - platform: gpio
    id: motor_left_2
    pin: GPIO6
    name: "Motor Left Down"
    interlock: *motor_left_interlock

globals:
  - id: end_stop_disable
    type: bool
    restore_value: yes
    initial_value: 'false'
  - id: cover_position # 0 = closed (2 = closing both, 1 = closing one), 5 = stopped middle, 10 = open (12 = opening both, 11 = opening one)
    type: int
    restore_value: yes
    initial_value: '0'

cover:
  - platform: template
    name: "Okno Rastlinjak"
    id: rastlinjak_cover
    lambda: !lambda |-
      if (id(cover_position) == 10) {
        return COVER_OPEN;
      } else if (id(cover_position) == 0) {
        return COVER_CLOSED;
      } else {
        return {};
      }
    open_action:
      then:
        - globals.set:
            id: end_stop_disable
            value: 'false'
        - if: # Disable end stop sensors when starting from closing position
            condition:
              lambda: return id(cover_position) < 5;
            then:
              - globals.set:
                  id: end_stop_disable
                  value: 'true'
        - globals.set:
            id: cover_position
            value: '12' # Set to opening
        - cover.template.publish:
            id: rastlinjak_cover
            current_operation: OPENING
        - switch.turn_on: motor_right_1
        - switch.turn_on: motor_left_1
        - script.execute: timeout_move
        - delay: 10s
        - globals.set:
            id: end_stop_disable
            value: 'false'
    close_action:
      then:
        - globals.set:
            id: end_stop_disable
            value: 'false'
        - if: # Disable end stop sensors when starting from opening position
            condition:
              lambda: return id(cover_position) > 5;
            then:
              - globals.set:
                  id: end_stop_disable
                  value: 'true'
        - globals.set:
            id: cover_position
            value: '2' # Set to closing
        - cover.template.publish:
            id: rastlinjak_cover
            current_operation: CLOSING
        - switch.turn_on: motor_right_2
        - switch.turn_on: motor_left_2
        - script.execute: timeout_move
        - delay: 10s
        - globals.set:
            id: end_stop_disable
            value: 'false'
    stop_action:
      then:
        - globals.set:
            id: end_stop_disable
            value: 'false'
        - globals.set:
            id: cover_position
            value: '5' # Set to stopped middle
        - cover.template.publish:
            id: rastlinjak_cover
            current_operation: IDLE
        - switch.turn_off: motor_right_1
        - switch.turn_off: motor_left_1
        - switch.turn_off: motor_right_2
        - switch.turn_off: motor_left_2
    optimistic: true

binary_sensor:
  - platform: template
    id: end_stop_right
    name: "End stop Right"
    condition:
      lambda: "return abs(id(hall_right_internal).state - 1.69) > (id(end_stop_right).state ? 0.07 : 0.15);"
    filters:
      - delayed_on_off: 100ms
    on_press:
      then:
        - if:
            condition:
              lambda: return !id(end_stop_disable);
            then:
              - switch.turn_off: motor_right_1
              - switch.turn_off: motor_right_2
              - if:
                  condition:
                    lambda: return id(cover_position) % 5 != 0;
                  then:
                    - lambda: id(cover_position) = id(cover_position) - 1; # Decrease position by 1 (closing one)
              - if:
                  condition:
                    lambda: return id(cover_position) % 10 == 0;
                  then:
                    - cover.template.publish:
                        id: rastlinjak_cover
                        current_operation: IDLE
  - platform: template
    id: end_stop_left
    name: "End stop Left"
    condition:
      lambda: "return abs(id(hall_left_internal).state - 1.64) > (id(end_stop_left).state ? 0.07 : 0.15);"
    filters:
      - delayed_on_off: 100ms
    on_press:
      then:
        - if:
            condition:
              lambda: return !id(end_stop_disable);
            then:
              - switch.turn_off: motor_left_1
              - switch.turn_off: motor_left_2
              - if:
                  condition:
                    lambda: return id(cover_position) % 5 != 0;
                  then:
                    - lambda: id(cover_position) = id(cover_position) - 1; # Decrease position by 1 (closing one)
              - if:
                  condition:
                    lambda: return id(cover_position) % 10 == 0;
                  then:
                    - cover.template.publish:
                        id: rastlinjak_cover
                        current_operation: IDLE

one_wire:
  - platform: gpio
    pin:
      number: GPIO7
      mode:
        input: true
        pullup: true
    id: one_wire_bus

sensor:
  - platform: dallas_temp
    id: temp_sensor
    name: "Temperature"
    update_interval: 30s
    resolution: 9
  - platform: adc
    id: hall_right_internal
    pin: GPIO0
    internal: true
    attenuation: 12db
    update_interval: 1ms
    filters:
      - median:
    samples: 8
  - platform: adc
    id: hall_left_internal
    pin: GPIO1
    internal: true
    attenuation: 12db
    update_interval: 1ms
    filters:
      - median:
    samples: 8
  - platform: template
    id: hall_right
    name: "Hall Right"
    update_interval: 1s
    lambda: return id(hall_right_internal).state;
    device_class: voltage
  - platform: template
    id: hall_left
    name: "Hall Left"
    update_interval: 1s
    lambda: return id(hall_left_internal).state;
    device_class: voltage

script:
  - id: timeout_move
    mode: restart
    then:
      - delay: 9min
      - if:
          condition:
            lambda: return id(cover_position) % 5 != 0; # Still moving
          then:
            - switch.turn_off: motor_right_1
            - switch.turn_off: motor_left_1
            - switch.turn_off: motor_right_2
            - switch.turn_off: motor_left_2
            - globals.set:
                id: cover_position
                value: '5' # Set to stopped middle
            - cover.template.publish:
                id: rastlinjak_cover
                current_operation: IDLE
            - homeassistant.service:
                service: notify.notify
                data:
                  title: Opozorilo za rastlinjak
                  message: Premikanje okna v rastlinjaku se ni zaključilo


status_led:
  pin:
    number: GPIO8
    inverted: true