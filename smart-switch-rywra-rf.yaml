esphome:
  name: smart-switch-rywra-rf
  friendly_name: Smart Switch RYWRA-RF

bk72xx:
  board: cb3s

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: "rv5s9Mhp0g9tmQS5DmdkGN0+kcbl+2PMEBeCEbFYmRw="
  on_client_connected:
    - if:
        condition:
          - switch.is_on: relay
        then:
          - output.turn_on: status_led

ota:
  - platform: esphome
    password: "10b46bd01463abaded03f833bd141e78"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Smart-Switch-Rywra-Rf"
    password: "SByo9Rx1JM7A"

captive_portal:
    

# Device Specific Config
binary_sensor:
    # Button on P14
  - platform: gpio
    id: binary_switch_1
    pin:
      number: P14
      inverted: true
      mode: INPUT_PULLUP
    on_press:
      - switch.toggle: relay
    internal: True

  # Button on P6
  - platform: gpio
    id: binary_switch_2
    pin:
      number: P6
      inverted: true
      mode: INPUT_PULLUP
    on_press:
      - switch.toggle: gpio1
    internal: True
    
  - platform: remote_receiver
    id: remote_button
    rc_switch_raw:
      code: "100011011100000001101000"
    filters:
      - settle: 250ms
    on_press:
      then:
        - switch.toggle: relay
        
  
switch:
  # Relay on P24
  - platform: gpio
    name: "Smart Switch Relay"
    id: relay
    pin: P24
    on_turn_on:
      - output.turn_on: status_led
    on_turn_off:
      - output.turn_off: status_led
    restore_mode: RESTORE_DEFAULT_OFF
  # GPIO switch on P7
  - platform: gpio
    name: "GPIO Switch"
    id: gpio1
    pin: P7
    restore_mode: RESTORE_DEFAULT_OFF

one_wire:
  # 1-Wire on P9
  - platform: gpio
    pin: 
      number: P9
      inverted: false
      mode: INPUT_PULLUP

sensor:
  - platform: dallas_temp
    name: "Temperature Sensor"
    update_interval: 15s

output:
  # Status led on P8
  - platform: gpio
    id: status_led
    pin:
      number: P8
      inverted: True


# RF 433MHz Reciever on P26
# https://img.ozdisan.com/ETicaret_Dosya/453934_1928180.pdf
# https://github.com/sui77/rc-switch

# https://www.elektroda.com/rtvforum/topic4076666.html
# https://esphome.io/components/remote_receiver/

remote_receiver:
  pin:
    number: P26
    inverted: true
    mode: INPUT_PULLUP
  dump:
    - rc_switch
  tolerance: 25%
  filter: 250us
  idle: 5ms
  buffer_size: 2kB

# Blink if not connected
# No WiFi: Long blink blink every 2s
# No API: Two short blinks every 2s
interval:
  interval: 2s
  then: 
    - if: 
        condition: 
          - not: wifi.connected
        then:
          - output.turn_on: status_led
          - delay: 0.5s
          - output.turn_off: status_led
        else:
          - if: 
              condition: 
                - not: api.connected
              then:
                - output.turn_on: status_led
                - delay: 0.2s
                - output.turn_off: status_led
                - delay: 0.1s
                - output.turn_on: status_led
                - delay: 0.2s
                - output.turn_off: status_led