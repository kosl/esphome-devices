esphome:
  name: greenhouse
  friendly_name: greenhouse

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: "3iDZ7dJTxRu1x+eATSRh86npaet63CsjMJvIjidhBb4="

ota:
  - platform: esphome
    password: "ec85827b83d03450623552f1bd6bc4b5"

wifi:
  #ssid: !secret wifi_ssid
  #password: !secret wifi_password
  ssid: "greenhouse"
  password: "12345678"
  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Greenhouse Fallback Hotspot"
    password: "12345678" #"n16yGTy9mDgR"

captive_portal:

web_server:
  port: 80

# I2C Bus for the display
i2c:
  sda: GPIO5
  scl: GPIO6
  scan: true
  id: bus_a

# Text sensor to store and display the message
text_sensor:
  - platform: template
    name: "Display Message"
    id: display_message
    # Initial default value
    lambda: |-
      return {"Hello World"};
    # Update the display when the message changes
    on_value:
      then:
        - component.update: my_display

# String input for changing the message
text:
  - platform: template
    name: "Set Display Text"
    id: set_display_text
    initial_value: "Hello World"
    mode: text
    # When text is received from Home Assistant, update the display message
    on_value:
      then:
        - text_sensor.template.publish:
            id: display_message
            state: !lambda return x.c_str();
    set_action:
      then:
        - text_sensor.template.publish:
            id: display_message
            state: !lambda return x.c_str();
        #- logger.log: "Display text updated via set_action: %s", x.c_str()

# SSD1306 Display (0.96 inch OLED)
display:
  - platform: ssd1306_i2c
    model: "SSD1306 128x64"
    address: 0x3C
    id: my_display
    #lambda: |-
    #  it.printf(64, 32, id(myfont), TextAlign::TOP_CENTER, "Poletna");
    #  // Optional: Add more text or graphics
    #  it.printf(64, 48, id(myfont), TextAlign::TOP_CENTER, "SOLA");
    lambda: |-
      // Get the current message from the text sensor
      const char* message = id(display_message).state.c_str();
      // Display the message centered on screen
      it.printf(64, 32, id(myfont), TextAlign::TOP_CENTER, "%s", message);
      
      // Optional: Add a small indicator that text can be changed
      it.printf(64, 50, id(small_font), TextAlign::TOP_CENTER, "Edit via HA");

# Fonts for the display
font:
  - file: "gfonts://Roboto"
    id: myfont
    size: 20
  - file: "gfonts://Roboto"
    id: small_font
    size: 12

# Optional: Add a button to restart the device
binary_sensor:
  - platform: gpio
    pin: GPIO9
    name: "Restart Button"
    on_press:
      then:
        - logger.log: "Restart button pressed"
        - delay: 500ms

# Optional: Status LED
output:
  - platform: gpio
    pin: GPIO8
    id: esp_status_led

light:
  - platform: status_led
    output: esp_status_led
    name: "Status LED"

# Optional: Add a sensor to show when the message was last updated
sensor:
  - platform: uptime
    name: "Uptime"
    id: uptime_sensor

