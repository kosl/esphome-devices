# Energy meter example 

esphome:
  name: energy-meter
  friendly_name: Deye bridge for SDM630
  min_version: 2026.1.0 
  devices: # https://esphome.io/components/esphome/#sub-devices
    - id: device_energy_meter
      name: "Eastron SDM 630 (fake meter)"

esp32:
  board: esp32-c3-devkitc-02
  framework:
    type: esp-idf

# Enable logging
logger:
  level: DEBUG
  logs:
    modbus_tcp_manager: DEBUG


api: # Enable Home Assistant API

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  output_power: 8.5dB
  power_save_mode: none  # Better reliability over power saving  

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Deye Fallback Hotspot"
    password: !secret wifi_password

captive_portal:

external_components:
  - source: github://Gucioo/esphome_modbus_tcp_master@slow-async
    components: [modbus_tcp_manager]
    refresh: 0s  # Always use latest version during development

# Single connection manager for the Modbus device
modbus_tcp_manager:
  id: modbus_device
  host: "192.168.1.31"  # IP address of your Modbus TCP server
  port: 502              # Default Modbus TCP port
  unit_id: 1             # Modbus unit/slave ID
  connection_timeout: 3s
  read_timeout: 3s

# Connection status monitoring
# binary_sensor:
#   - platform: modbus_tcp_manager
#     modbus_tcp_id: modbus_device
#     name: "Modbus Connection Status"
#     device_class: connectivity
#     lambda: |-
#        auto *modbus = id(modbus_device);
#        return (modbus != nullptr) && modbus->is_connected();

binary_sensor:
  - platform: template
    name: "Modbus Connection"
    id: modbus_connection
    device_class: connectivity
    lambda: |-
      auto *modbus = id(modbus_device);
      return (modbus != nullptr) && modbus->is_connected();

uart:
  # GPIO20 - RX to RXD of top RS485 module
  # GPIO21 - TX to TXD of top RS485 module
  - id: uart_meter
    tx_pin: GPIO21
    rx_pin: GPIO20 
    baud_rate: 9600
    debug:
      direction: BOTH
  # GPIO6 - RX to RXD of middle RS485 module
  # GPIO5 - TX to TXD of middle RS485 module
  - id: uart_master
    rx_pin: GPIO6
    tx_pin: GPIO5
    baud_rate: 9600 #if your energy meter is SDM230M or SDM120M than change the baud_rate: 2400
    stop_bits: 1      
modbus:
  - id: modbus_eastron
    uart_id: uart_meter
    role: server # https://esphome.io/components/modbus_controller/#example-server
  - id: modbus_master
    uart_id: uart_master

# Include packages for Eastron
packages:
   energy_meter: !include
     file: fake-eastron.yaml
     vars:
       ct_update_interval: 5s
       energy_meter_device_id: device_energy_meter


# Example configuration entry
sensor:
  - platform: sdm_meter
    modbus_id: modbus_master
    update_interval: 10s    
    address: 1
    phase_a:
      current:
        name: "SDM230M Current"
      voltage:
        name: "SDM230M Voltage"
      active_power:
        name: "SDM230M Power"
      power_factor:
        name: "SDM230M Power Factor"
      apparent_power:
        name: "SDM230M Apparent Power"
      reactive_power:
        name: "SDM230M Reactive Power"
      phase_angle:
        name: "SDM230M Phase Angle"
    frequency:
      name: "SDM230M Frequency"
    total_power:
      name: "SDM230M Total Power"
    import_active_energy:
      name: "SDM230M Import Active Energy"
    export_active_energy:
      name: "SDM230M Export Active Energy"

