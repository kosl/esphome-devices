    unit_of_measurement: ""
    accuracy_decimals: 0

  - platform: template
    name: "Register 37001"
    id: reg_37001_sensor
    unit_of_measurement: ""
    accuracy_decimals: 0

  - platform: template
    name: "Register 37002"
    id: reg_37002_sensor
    unit_of_measurement: ""
    accuracy_decimals: 0

  - platform: template
    name: "Register 37003"
    id: reg_37003_sensor
    unit_of_measurement: ""
    accuracy_decimals: 0


  # =========== Diagnostic sensors ===========
#sensor:
  - platform: wifi_signal
    name: "WiFi Signal Strength"
    id: wifi_rssi
    update_interval: 1min  
    unit_of_measurement: "dBm"
    accuracy_decimals: 0
    device_class: signal_strength
    entity_category: diagnostic 

# Enable built-in status LED on GPIO8
light:
  - platform: status_led
    id: esp_status_led
    pin:
      number: GPIO8
      inverted: true
      ignore_strapping_warning: true
    entity_category: diagnostic      

# Text sensor showing all values
text_sensor:
  - platform: template
    name: "Registers 37000-37003"
    id: all_registers_status
    lambda: |-
      return {"Async operations active"};

# **TRUE ASYNC**: 5-second interval with instant return
interval:
  - interval: 5s  # Your requested 5-second updates!
    then:
      - lambda: |-
          auto *modbus = id(modbus_device);
          if (modbus == nullptr || !modbus->is_connected()) {
            ESP_LOGD("async", "Modbus not connected");
            return;
          }
          
          ESP_LOGI("async", "Starting 5-second async read (returns instantly!)");
          
          // **CRITICAL**: This call returns IMMEDIATELY - no blocking!
          modbus->read_registers_async(40195, 4, 
            esphome::modbus_tcp::ModbusFunction::READ_HOLDING_REGISTERS,
            [](const esphome::modbus_tcp::ModbusResponse& response) {
              // This callback runs when data arrives (maybe 3 seconds later)
              if (response.success && response.data.size() == 4) {
                // Update all sensors from callback
                id(reg_37000_sensor).publish_state(static_cast<int16_t>(response.data[0]));
                id(reg_37001_sensor).publish_state(static_cast<int16_t>(response.data[1]));
                id(reg_37002_sensor).publish_state(static_cast<int16_t>(response.data[2]));
                id(reg_37003_sensor).publish_state(static_cast<int16_t>(response.data[3]));
                
                // Update text sensor too
                std::string result = "37000:" + to_string(static_cast<int16_t>(response.data[0])) + 
                                   " 37001:" + to_string(static_cast<int16_t>(response.data[1])) + 
                                   " 37002:" + to_string(static_cast<int16_t>(response.data[2])) + 
                                   " 37003:" + to_string(static_cast<int16_t>(response.data[3]));
                id(all_registers_status).publish_state(result);
                
                ESP_LOGI("async", "5-second async read completed: %s", result.c_str());
              } else {
                ESP_LOGW("async", "5-second async read failed: %s", response.error_message.c_str());
                id(all_registers_status).publish_state("Read Failed: " + response.error_message);
              }
            });
          
          // **EXECUTION CONTINUES HERE IMMEDIATELY**
          // ESPHome is free to do other things while Modbus works in background
          ESP_LOGI("async", "Async request queued - ESPHome continues running!");
 # Connection status update
  - interval: 10s
    then:
      - lambda: |-
          auto *connection_sensor = id(modbus_connection);
          auto *modbus = id(modbus_device);
          if (connection_sensor && modbus) {
            bool connected = modbus->is_connected();
            connection_sensor->publish_state(connected);
          }
  # Health monitoring (without WiFi check to avoid compilation issues)
