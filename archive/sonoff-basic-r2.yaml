esphome:
  name: sonoff-basic-r2
  friendly_name: Sonoff Basic R2

esp8266:
  board: esp01_1m
  restore_from_flash: True

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: "oqX1PVpzhoUN4HztwxGV6lKaiC4urSEIuSBSBSQBZHw="

ota:
  - platform: esphome
    password: "278bd4fa386c6b503c30ddebf99a4bb6"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Sonoff-Basic-R2 Fallback Hotspot"
    password: "ylPXNnNjLs8X"

captive_portal:
  

# Device Specific Config
binary_sensor:
  - platform: gpio
    id: push_button
    pin:
      number: GPIO0
      mode: INPUT_PULLUP
      inverted: True
    internal: true

  - platform: gpio
    id: pir
    name: "PIR Sensor"
    device_class: motion
    pin:
      number: GPIO14
      mode: INPUT_PULLUP
      inverted: True

output:
  - platform: gpio
    id: relay
    pin: GPIO12

  - platform: gpio
    id: green_led
    pin:
      number: GPIO13
      inverted: True

light:
  - platform: binary
    name: "Vhodna luč"
    id: light1
    output: relay

# Blink if not connected
interval:
  interval: 2s
  then: 
    - if: 
        condition: 
          - not: wifi.connected
        then:
          - output.turn_on: green_led
          - delay: 0.5s
          - output.turn_off: green_led
        else:
          - if: 
              condition: 
                - not: api.connected
              then:
                - output.turn_on: green_led
                - delay: 0.2s
                - output.turn_off: green_led
                - delay: 0.1s
                - output.turn_on: green_led
                - delay: 0.2s
                - output.turn_off: green_led