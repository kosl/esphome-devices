  - platform: gpio
    id: cp_ch_out_b_out
    pin: GPIO7

  - platform: gpio
    id: cp_ch_out_c_out
    pin: GPIO6

  - platform: ledc
    id: cp_ev_out_pwm
    pin: GPIO10
    frequency: 1000Hz # default

