# Control Pilot voltage sampling at ADC at GPIO0 occurs 50 µs after PWM (ledc at GPIO10) rising edge
# Heartbeat sampling at 500 Hz in DC mode (when PWM is disabled) 
evse_cp_sampler:
    id: cp_sampler
    samples: 250
    on_raw_value:
      - lambda: |-
          ESP_LOGD("evse_cp_sampler", "CP Sampler Average raw ADC value: %d", x);
          id(cp_ev_in_diag).publish_state(x);
    on_state_change:
      - lambda: |-
          const int state = x;
          ESP_LOGI("evse", "New EVSE state detected: %d", state);
          id(evse_state_sensor).publish_state(state);
          id(charging_state).update();


sensor:
  # State tracking sensor
  - platform: template
    id: evse_state_sensor
    internal: true
    update_interval: never
    on_value:
      then: # State change triggers updates to all dependent sensors
        - lambda: |-          
            id(pwm_duty_calc).update();
            id(ch_b_output_calc).update();
            id(ch_c_output_calc).update();

  # PWM duty calculation
  - platform: template
    id: pwm_duty_calc
    internal: true
    update_interval: never
    on_value:
      then:
        - lambda: |-
            const int state = id(evse_state_sensor).state;
            const bool enabled = id(charging_enabled).state;
            const float amps = id(charging_amps).state;
            
            float pwm_pct;
            if(state == 1) {
              pwm_pct = 100.0f;
            } else if(state == 2 || state == 3) {
              pwm_pct = enabled ? (amps / 0.6f) : 100.0f;
            } else {
              pwm_pct = 0.0f;
            }
            
            if(pwm_pct < 0.0f) pwm_pct = 0.0f;
            if(pwm_pct > 100.0f) pwm_pct = 100.0f;
            
            ESP_LOGI("evse", "Setting PWM duty to %.1f%%", pwm_pct);
            id(cp_ev_out_pwm).set_level(pwm_pct / 100.0f);
            id(pwm_duty).publish_state(pwm_pct);

  # Channel B output calculation
  - platform: template
    id: ch_b_output_calc
    internal: true
    update_interval: never
    on_value:
      then:
        - lambda: |-
            const int state = id(evse_state_sensor).state;
            bool ch_b = (state == 2 || state == 3);
            
            static bool last_ch_b = false;
            if(ch_b != last_ch_b) {
              ESP_LOGI("evse", "Setting CH B to %s", ch_b ? "HIGH" : "LOW");
              id(cp_ch_out_b_out).set_state(ch_b);
              last_ch_b = ch_b;
            }

  # Channel C output calculation
  - platform: template
    id: ch_c_output_calc
    internal: true
    update_interval: never
    on_value:
      then:
        - lambda: |-
            const int state = id(evse_state_sensor).state;
            bool ch_c = (state == 3);
            
            static bool last_ch_c = false;
            if(ch_c != last_ch_c) {
              ESP_LOGI("evse", "Setting CH C to %s", ch_c ? "HIGH" : "LOW");
              id(cp_ch_out_c_out).set_state(ch_c);
              last_ch_c = ch_c;
            }

