    name: "Status LED"
    id: esp_status_led
    icon: "mdi:alarm-light"
    pin:
      number: GPIO8
      inverted: true
      ignore_strapping_warning: true 
    entity_category: diagnostic
    restore_mode: ALWAYS_OFF


