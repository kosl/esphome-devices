button:
  - platform: restart
    name: "Reboot Device"
    id: reboot_device

##### PACE BMS
esphome:
  name: tesla-teze
  devices: # https://esphome.io/components/esphome/#sub-devices
    - id: device_pace_bms1
      name: "PACE BMS Pack 1"
    - id: device_pace_bms2
      name: "PACE BMS Pack 2"
  on_boot:
    priority: 600  # Medium-high priority (after WiFi connects)
    then:
      - light.turn_on:
          id: esp_status_led
          red: 80%
          green: 0%
          blue: 0%
          brightness: 80%


uart:
  - id: rs485
    tx_pin: GPIO1
    rx_pin: GPIO2
    baud_rate: 9600
    debug:
      direction: BOTH
      # dummy_receiver: false

modbus:
  send_wait_time: 200ms
  uart_id: rs485
  id: mod_bus

modbus_controller:
  - id: pace_bms1
    address: 0x01
    modbus_id: mod_bus
    command_throttle: 200ms
    update_interval: 30s
  - id: pace_bms2
    address: 0x02
    modbus_id: mod_bus
    command_throttle: 200ms
    update_interval: 30s
 