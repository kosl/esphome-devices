# Enable built-in status LED on GPIO8
light:
  - platform: esp32_rmt_led_strip
    rgb_order: GRB
    chipset: ws2812
    pin: 
      number: GPIO21
    num_leds: 1
    name: "Onboard RGB LED"
    id: esp_status_led
    entity_category: diagnostic

