substitutions:
  friendly_name: Tesla & Teze
  device_name: tesla-teze
  device_description: Tesla BLE
  ble_mac_address: !secret ble_mac_address
  tesla_vin: !secret tesla_vin
  charging_amps_max: "16"
  board: "esp32-s3-fh4r2"
  #board: esp32-s3-devkitc-1
  variant: esp32s3
  ble_presence_timeout: 15s
  #tesla_ble_component: "github://PedroKTFC/esphome-tesla-ble@repair"
  #BLE_library: "https://github.com/PedroKTFC/tesla-ble.git#repair"
  
logger:
  level: INFO

wifi:
  output_power: 10.5dB # Minimise self interference
  ssid: !secret wifi_eteradxa_ssid
  password: !secret wifi_password  
  power_save_mode: none  # Better reliability over power saving

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Tesla-Teze Fallback Hotspot"
    password: "49s85A5nR3iL"

  on_connect: 
    then:
      - light.turn_on:
          id: esp_status_led
          red: 0%
          green: 80%
          blue: 0%
          brightness: 80%

captive_portal:

api:
  encryption:
    key: !secret api_encryption_key
    
packages:
  remote_package_files:
    url: https://github.com/PedroKTFC/esphome-tesla-ble/
    path: packages
    files: [base.yml, common.yml, project.yml, client.yml]
    ref: v2026.2.1
  bms1: !include
    file: device-pace-bms.yaml
    vars:
      modbus_controller_id: pace_bms1
      device_id: device_pace_bms1
  bms2: !include
    file: device-pace-bms.yaml
    vars:
      modbus_controller_id: pace_bms2
      device_id: device_pace_bms2

  # listener: github://PedroKTFC/esphome-tesla-ble/packages/listener.yml # Uncomment this to scan find your VIN BLE MAC address

