  #   id: cc_l3_raw
  #   pin: GPIO4
  #   #raw: true
  #   attenuation: 12db
  #   #update_interval: 250ms
  #   #accuracy_decimals: 0

  # - platform: ct_clamp
  #   sensor: cc_l1_raw
  #   name: "CC L1 Current"
  #   sample_duration: 2s
  #   update_interval: 5s


  - platform: template
    name: "PWM Duty"
    id: pwm_duty
    unit_of_measurement: "%"
    accuracy_decimals: 1
    entity_category: diagnostic
    lambda: |-
      return id(evse_pwm_duty_pct);
    update_interval: 250ms

interval:
  - interval: 0us
    then:
      - lambda: |-
          const int state = id(evse_state);
          if(state == 0) return;
          bool ch_b, ch_c;
          float pwm_pct;
          if(state == 1) {
            ch_b = false;
            ch_c = false;
            pwm_pct = 100.0f;
          } else if(state == 2) {
            ch_b = true;
            ch_c = false;
            pwm_pct = id(evse_charging_enabled) ? (id(evse_charging_amps) / 0.6f) : 100.0f;
          } else /* state == 3 */ {
            ch_b = true;
            ch_c = true;
            pwm_pct = id(evse_charging_enabled) ? (id(evse_charging_amps) / 0.6f) : 100.0f;
          }
          if(pwm_pct < 0.0f) pwm_pct = 0.0f;
          if(pwm_pct > 100.0f) pwm_pct = 100.0f;

          if(ch_b != id(evse_ch_b)) {
            ESP_LOGI("evse", "Setting CH B to %s", ch_b ? "HIGH" : "LOW");
            id(cp_ch_out_b_out).set_state(ch_b);
            id(evse_ch_b) = ch_b;
          }
          if(ch_c != id(evse_ch_c)) {
            ESP_LOGI("evse", "Setting CH C to %s", ch_c ? "HIGH" : "LOW");
            id(cp_ch_out_c_out).set_state(ch_c);
            id(evse_ch_c) = ch_c;
          }
          if(fabsf(pwm_pct - id(evse_pwm_duty_pct)) >= 0.05f) {
            ESP_LOGI("evse", "Setting PWM duty to %.1f%%", pwm_pct);
            id(cp_ev_out_pwm).set_level(pwm_pct / 100.0f);
            id(evse_pwm_duty_pct) = pwm_pct;
          }
