captive_portal:

# - CP_CH_IN   GPIO1 (ADC)
# - CP_CH_OUT_B GPIO7 (digital out)
# - CP_CH_OUT_C GPIO6 (digital out)
# - CP_EV_IN   GPIO0 (ADC)
# - CP_EV_OUT  GPIO10 (PWM out)
# - CC_L1      GPIO2 (ADC)
# - CC_L2      GPIO3 (ADC)
# - CC_L3      GPIO4 (ADC)

light:
  - platform: status_led
    name: "Status LED"
    id: esp_status_led
    icon: "mdi:alarm-light"
    pin:
      number: GPIO8
      inverted: true
      ignore_strapping_warning: true 
    internal: true
    restore_mode: ALWAYS_OFF


output:
  - platform: gpio
    id: cp_ch_out_b_out
    pin: GPIO7

  - platform: gpio
    id: cp_ch_out_c_out
    pin: GPIO6

  - platform: ledc
    id: cp_ev_out_pwm
    pin: GPIO10
    frequency: 1000Hz

globals:
  - id: evse_charging_enabled
    type: bool
    restore_value: true
    initial_value: "false"

  - id: evse_charging_amps
    type: float
    restore_value: true
    initial_value: "6.0"

  - id: evse_pwm_duty_pct
    type: float
    initial_value: "0.0"
  
  - id: evse_ch_b
    type: bool
    initial_value: "false"

  - id: evse_ch_c
    type: bool
    initial_value: "false"

  # 0=unknown, 1=A, 2=B, 3=C
  - id: evse_state
    type: int
    initial_value: "1"

  - id: evse_candidate_state
    type: int
    initial_value: "0"

  - id: evse_candidate_count
    type: int
    initial_value: "0"

switch:
  - platform: template
    name: "Charging Enabled"
    id: charging_enabled
    restore_mode: RESTORE_DEFAULT_OFF
    lambda: |-
      return id(evse_charging_enabled);
    turn_on_action:
      - lambda: |-
          id(evse_charging_enabled) = true;
    turn_off_action:
      - lambda: |-
          id(evse_charging_enabled) = false;

number:
  - platform: template
    name: "Charging Amps"
    id: charging_amps
    min_value: 6
    max_value: 16
    step: 1
    mode: slider
    lambda: |-
      return id(evse_charging_amps);
    set_action:
      - lambda: |-
          id(evse_charging_amps) = x;

text_sensor:
  - platform: template
    name: "Charging State"
    entity_category: diagnostic
    lambda: |-
      switch (id(evse_state)) {
        case 1: return std::string{"A"};
        case 2: return std::string{"B"};
        case 3: return std::string{"C"};
        default: return std::string{"Unknown"};
      }
    update_interval: 250ms

sensor:
  - platform: adc
    id: cp_ch_in
    pin: GPIO1
    attenuation: 12db
    raw: true
    update_interval: 0us
    internal: true

  - platform: copy
    name: "Charger CP"
    id: cp_ch_in_diag
    source_id: cp_ch_in
    accuracy_decimals: 0
    entity_category: diagnostic
    filters:
      - throttle: 1s
    
  - platform: adc
    id: cp_ev_in
    pin: GPIO0
    attenuation: 12db
    raw: true
    update_interval: 0us
    internal: true

  - platform: copy
    name: "Vehicle CP"
    id: cp_ev_in_diag
    source_id: cp_ev_in
    accuracy_decimals: 0
    entity_category: diagnostic
    filters:
      - throttle: 1s

  - platform: copy
    id: cp_ev_in_state
    source_id: cp_ev_in
    internal: true
    filters:
      - lambda: |-
          if (x == 4095.0f) return 1;
          else if (fabsf(x - 3200.0f) < 100.0f) return 3;
          else if (fabsf(x - 3650.0f) < 100.0f) return 2;
          else return 0;
      - filter_out: 0
    on_value:
      then:
        - lambda: |-
            const int new_state = (int)x;
            if(id(evse_state) == new_state) {
              return;
            }
            ESP_LOGI("evse", "Detected candidate state: %d", new_state);
            if(id(evse_candidate_count) == 0) {
              ESP_LOGI("evse", "Starting candidate state tracking: %d", new_state);
              id(evse_candidate_state) = new_state;
              id(evse_candidate_count) = 1;
              return;
            }
            if(new_state == id(evse_candidate_state)) {
              ESP_LOGI("evse", "Incrementing candidate state count: %d", id(evse_candidate_count) + 1);
              id(evse_candidate_count) += 1;
            } else {
              ESP_LOGI("evse", "Resetting candidate state to: %d", new_state);
              id(evse_candidate_state) = new_state;
              id(evse_candidate_count) = 1;
            }
            if(id(evse_candidate_count) > 3) {
              ESP_LOGI("evse", "Committing to new state: %d", new_state);
              id(evse_state) = new_state;
              id(evse_candidate_count) = 0;
            }

  # - platform: adc
  #   name: "CC L1 Raw"
  #   id: cc_l1_raw
  #   pin: GPIO2
  #   #raw: true
  #   attenuation: 12db
