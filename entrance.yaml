# VHM-001 board
# https://devices.esphome.io/devices/esp-01s-1-channel-relay/

esphome:
  name: entrance 
  friendly_name: Entrance

esp8266:
  board: esp01_1m

# Enable logging
logger:
  baud_rate: 0

# Enable Home Assistant API
api:
  encryption:
    key: "FcHCEV83U0AjgrdteM6+3EYsbwEUe2HP1/tXH2x/UrU="

ota:
  - platform: esphome
    encryption:
      key: "FcHCEV83U0AjgrdteM6+3EYsbwEUe2HP1/tXH2x/UrU="

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  domain: .local.wgn.si
  min_auth_mode: WPA2
  
  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Entrance Fallback Hotspot"
    password: "oerTaiqxjWAJ"

captive_portal:

light:
  - platform: binary
    output: output_relay
    name: "Entrance Light"
    id: relay
    # Optional: restore state after power loss
    restore_mode: RESTORE_DEFAULT_OFF
    # Clear motion as soon as the light turns on; re-evaluate when it turns off
    on_turn_on:
      - binary_sensor.template.publish:
          id: entrance_motion
          state: OFF
    on_turn_off:
      - lambda: |-
          id(entrance_motion).publish_state(id(pir).state);

# Output component for the relay pin
output:
  - platform: gpio
    pin:
      number: 0
      inverted: true
    id: output_relay

switch:
  - platform: restart
    name: Restart


binary_sensor:
  # Raw PIR – kept internal
  - platform: gpio
    id: pir
    pin:
      number: 2
      inverted: true     # PIR: HIGH idle → LOW on motion
      mode:
        input: true
        pullup: true
    internal: true
    on_state:
      then:
        - lambda: |-
            // Only report motion when the light is currently OFF
            id(entrance_motion).publish_state(x && !id(relay).current_values.is_on());

  # Motion reported to Home Assistant only when light is off
  - platform: template
    name: "Entrance Motion"
    id: entrance_motion
    device_class: motion

sensor:
  - platform: wifi_signal
    name: WiFi signal
    update_interval: 600s
    icon: mdi:wifi

  # human readable uptime sensor output to the text sensor above
  - platform: uptime
    name: Uptime
    id: uptime_sensor
    update_interval: 60s
    entity_category: diagnostic
    icon: mdi:clock-outline

time:
  - platform: homeassistant
    id: homeassistant_time

# Text sensors with general information.
text_sensor:
  # Expose ESPHome version as sensor.
  - platform: version
    name: Version
  # Expose WiFi information as sensors.
  - platform: wifi_info
    ip_address:
      name: IP
    bssid:
      name: BSSID
